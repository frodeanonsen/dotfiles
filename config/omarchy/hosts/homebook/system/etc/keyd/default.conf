# keyd: the Mac Option letters on a Linux keyboard. Alt+a is å, Alt+o is ø,
# Alt+' is æ, with Shift for the capitals. Only these six chords are taken;
# every other Alt combination passes through, so Alt+Tab, the Super+Alt
# bindings and the terminal's Meta keys are unaffected.
#
# Installed to /etc/keyd/default.conf by scripts/install_omarchy_system.sh,
# which also enables keyd and reloads it. Check the running config with
# `keyd check` and watch what it emits with `sudo keyd monitor`.

[ids]

*

[main]

[alt]
a = å
o = ø
apostrophe = æ

[alt+shift]
a = Å
o = Ø
apostrophe = Æ
