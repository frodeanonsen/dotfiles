# Only ever suspend with S3 ("deep"). systemd's default SuspendState is
# "mem standby freeze", tried in turn: when a deep suspend fails (the Broadcom
# Wi-Fi chip sometimes times out entering D3) it silently falls through to
# "freeze", which is s2idle, and s2idle has never come back cleanly on this
# T2 MacBook Pro: the Thunderbolt controllers die on resume and the machine
# hard-crashes soon after (Feb 14 and Oct 4 2026). With only "mem" listed a
# failed suspend returns to the desktop instead, and can simply be retried.
# mem_sleep_default=deep on the kernel command line does not prevent the
# fallback, hence this drop-in.
#
# Do not bring back the t2linux hook that unloads brcmfmac before suspend to
# dodge that timeout (suspend-t2.service, tried Oct 4 2026). With the driver
# gone the PCI core disables the chip, and after longer S3 sleeps it came back
# dead in 2 of 5 resumes ("Unable to change power state from unknown to D0,
# device inaccessible", probe fails on all-ones reads); removing the device
# and rescanning the root port found nothing, only a reboot helped. With the
# driver loaded every one of the 30-odd resumes before that reconnected Wi-Fi
# within 5 s, including a 21 h sleep. The D3 timeout itself has aborted one
# suspend in 37.
[Sleep]
SuspendState=mem
MemorySleepMode=deep
