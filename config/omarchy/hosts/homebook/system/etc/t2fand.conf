# t2fanrd ships a curve that starts at 55°C and hits full speed at 75°C. The
# i9-8950HK idles warm and sits at 60-65°C under light load such as video
# playback, which put both fans at ~4400 RPM. The CPU throttles at 100°C, so
# stay at minimum until 65°C and only reach full speed at 90°C, closer to what
# macOS does.
[Fan1]
low_temp=65
high_temp=90
speed_curve=linear
always_full_speed=false

[Fan2]
low_temp=65
high_temp=90
speed_curve=linear
always_full_speed=false
