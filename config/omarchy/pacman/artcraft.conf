# ArtCraft's own pacman repository, https://getartcraft.com/linux: the Craft
# apps as ai.storyteller.<app> and ArtCraft itself as ai.artcraft.app.
# Installed to /etc/pacman.d/ and included from /etc/pacman.conf by
# scripts/install_artcraft_repo.sh, which also imports the signing key.
[artcraft]
SigLevel = Required DatabaseRequired
Server = https://getartcraft.com/arch/$arch
