# The T2 chip exposes a USB network interface (cdc_ncm, always
# ac:de:48:00:11:22) that macOS uses to talk to BridgeOS. It carries nothing
# on Linux and its transmit queue is stuck after every resume, so
# NetworkManager must not keep auto-activating a wired profile on it.
[keyfile]
unmanaged-devices+=mac:ac:de:48:00:11:22
