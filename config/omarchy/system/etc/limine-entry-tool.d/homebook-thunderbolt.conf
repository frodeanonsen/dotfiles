# Keep PCIe ports out of D3 so the two Thunderbolt controllers are not polled
# for ~6s each after S3 resume. Measured with /sys/power/pm_print_times on
# MacBookPro15,1: wake dropped from ~19s of bridge waits. Costs a little idle
# power because the Thunderbolt ports never runtime-suspend.
KERNEL_CMDLINE[default]+=" pcie_port_pm=off"
