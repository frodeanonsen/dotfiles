# Read by /opt/vivaldi/vivaldi on launch; one flag per line.
#
# Chromium leaves VA-API video decode off on Linux, so video was decoded in
# software (a YouTube tab at ~165% CPU). This turns it on. On homebook the
# browser renders on the Radeon Pro 560X, whose radeonsi VA-API driver decodes
# H.264 and HEVC but not VP9 or AV1, so YouTube also needs an extension such
# as enhanced-h264ify to be served H.264; bodbook's Iris 6100 has the same
# gap. Check vivaldi://gpu for
# "Video Decode: Hardware accelerated".
--enable-features=AcceleratedVideoDecodeLinuxGL,AcceleratedVideoDecodeLinuxZeroCopyGL
